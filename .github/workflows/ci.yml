# CI Cashup : type-check → tests unitaires → build → tests de fumée HTTP.
#
# Les tests de fumée (tests/smoke.test.ts) se mettent d'eux-mêmes de côté
# si le serveur n'est pas joignable : ici, le serveur de production est
# démarré en fin de workflow pour les exécuter pour de bon.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: Type-check, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma (SQLite local)
        run: npm run db:generate:local

      - name: Initialiser la base locale
        run: npm run db:push

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Démarrer le serveur de production
        run: |
          npm start -- -p 3100 &
          npx --yes wait-on http://localhost:3100 --timeout 60000

      - name: Tests de fumée (HTTP)
        run: SMOKE_BASE_URL=http://localhost:3100 npm test

      - name: Arrêter le serveur
        if: always()
        run: |
          pkill -f "next start" || true
